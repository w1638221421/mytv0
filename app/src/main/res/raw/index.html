<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0">
    <title>我的电视·〇</title>
    <style>
        body {
            height: 100vh;
            margin: 0;
            padding: 1rem;
            background-color: #263238;
            color: #EEEEEE;
        }

        a {
            color: #EEEEEE;
        }

        hr {
            margin-top: .5rem;
            margin-bottom: .5rem;
        }

        label {
            display: inline-block;
            width: 100%;
            margin-bottom: .5rem;
        }

        textarea {
            resize: none;
            overflow: auto;
        }

        input[type="file"] {
            color: #EEEEEE;
            cursor: pointer;
        }

        input, textarea {
            color: #1a1a1a;
            padding: .6rem;
            border: none;
            border-radius: 4px;
            transition: box-shadow 0.3s ease-in-out;
            vertical-align: bottom;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #66afe9;
            box-shadow: 0 0 10px rgba(102, 175, 233, 0.6);
        }

        .container {
            display: flex;
            flex-direction: row;
        }

        input[type="text"], input[type="number"], textarea {
            flex: 1;
            box-sizing: border-box;
        }

        input[type="text"], input[type="number"], input[type="file"], input[type="button"] {
            height: 2.6rem;
        }

        input[type="button"] {
            margin-left: .6rem;
            cursor: pointer;
        }

        .source-grey {
            background-color: grey;
        }

        .source-green {
            background-color: darkslategray;
        }

        .history {
            margin-top: 10px;
        }

        .history > input[type="text"], .history > input[type="number"] {
            color: #EEEEEE;
        }

        .message-box {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background-color: #333;
            color: #fff;
            border-radius: 5px;
            opacity: 0;
            transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
            transform: translateX(100%);
        }

        .message-box.show {
            opacity: 1;
            transform: translateX(0);
        }
    </style>
</head>
<body>
<h1 class="title">我的电视·〇</h1>
<h4>视频源可以设置为地址/文本/文件其中之一</h4>
<h4>视频源文本转换：<a target="_blank" href="https://lizongying.github.io/js-gua64/">六十四卦编码</a></h4>
<hr/>

<div class="item">
    <label for="uri" id="uri-label">视频源地址</label>
    <div class="container">
        <input type="text" id="uri"/>
        <input type="button" id="confirm-uri" value="新增" class="add"/>
    </div>
    <div id="sources-new"></div>
    <div id="source"></div>
</div>

<hr/>

<div class="item">
    <label for="plain-text" id="plain-text-label">视频源文本</label>
    <div class="container">
        <textarea id="plain-text" rows="4"/></textarea>
        <input type="button" id="confirm-plain-text" value="确认" class="confirm"/>
    </div>
</div>

<hr/>

<div class="item">
    <label for="upload-file" id="upload-file-label">视频源文件，选择后会自动上传保存</label>
    <div class="container">
        <input type="file" id="upload-file" multiple/>
    </div>
</div>

<hr/>

<div class="item">
    <label for="channel" id="channel-label">默认播放频道号，从1开始。0代表默认设置</label>
    <div class="container">
        <input type="number" id="channel" min="0" max="99"/>
        <input type="button" id="confirm-channel" value="确认" class="confirm"/>
    </div>
</div>

<hr/>

<div class="item">
    <label for="epg" id="epg-label">EPG</label>
    <div class="container">
        <input type="text" id="epg"/>
        <input type="button" id="confirm-epg" value="确认" class="confirm"/>
    </div>
</div>

<hr/>

<div class="item">
    <label for="proxy" id="proxy-label">代理地址</label>
    <div class="container">
        <input type="text" id="proxy"/>
        <input type="button" id="confirm-proxy" value="确认" placeholder="http://0.0.0.0:0" class="confirm"/>
    </div>
</div>

<hr/>

<div id="messageBox" class="message-box"></div>

<div style="height: 100%"></div>
</body>
<script>
    const lang = {
        TRADITIONAL_CHINESE: {
            appName: '我的电视·〇',
            description: '视频源可以设置为地址/文本/文件其中之一',
            uriLabel: '视频源地址',
            plainTextLabel: '视频源文本',
            uploadFileLabel: '视频源文件，选择后会自动上传保存',
            channelLabel: '默认播放频道，从1开始。0代表默认设置',
            epgLabel: 'EPG',
            proxyLabel: '代理地址',
            confirm: '确认',
            remove: '删除',
            add: '新增',
        },
        SIMPLIFIED_CHINESE: {
            appName: '我的电视·〇',
            description: '视频源可以设置为地址/文本/文件其中之一',
            uriLabel: '视频源地址',
            plainTextLabel: '视频源文本',
            uploadFileLabel: '视频源文件，选择后会自动上传保存',
            channelLabel: '默认播放频道，从1开始。0代表默认设置',
            epgLabel: 'EPG',
            proxyLabel: '代理地址',
            confirm: '确认',
            remove: '删除',
            add: '新增',
        }
    };
    const t = (key) => lang['TRADITIONAL_CHINESE'][key];

    // ------------------------------------------------------------------
    // 访问令牌：由电视端二维码携带，所有接口都必须带上，过期后写操作被拒绝
    // ------------------------------------------------------------------
    const TOKEN = new URLSearchParams(location.search).get('t') || '';
    const api = (path) => path + (path.indexOf('?') >= 0 ? '&' : '?') + 't=' + encodeURIComponent(TOKEN);

    class UnauthorizedError extends Error {
    }

    const request = async (path, options) => {
        options = options || {};
        const headers = Object.assign({'X-Auth-Token': TOKEN}, options.headers || {});
        const response = await fetch(api(path), Object.assign({}, options, {headers: headers}));
        if (response.status === 401) {
            throw new UnauthorizedError('unauthorized');
        }
        return response;
    };

    const showMessage = (message, duration = 3000) => {
        const messageBox = document.getElementById('messageBox');
        messageBox.textContent = message;
        messageBox.classList.add('show');

        setTimeout(() => {
            messageBox.classList.remove('show');
        }, duration);
    }

    const reportError = (e) => {
        if (e instanceof UnauthorizedError) {
            showMessage('访问令牌无效或已过期，请在电视上重新生成二维码', 6000);
        } else {
            showMessage('请求失败，请确认电视与手机在同一局域网', 5000);
        }
    };

    // 用 DOM API 构建节点，避免把直播源内容当作 HTML 注入页面
    const createRow = (uri, inputClass, buttonText, buttonClass) => {
        const container = document.createElement('div');
        container.className = 'container history';

        const input = document.createElement('input');
        input.type = 'text';
        input.readOnly = true;
        input.value = uri;
        input.className = inputClass;

        const button = document.createElement('input');
        button.type = 'button';
        button.value = buttonText;
        button.className = buttonClass;

        container.appendChild(input);
        container.appendChild(button);
        return container;
    };

    const buttonOf = (row) => row.querySelector('input[type=button]');

    document.querySelector('h1').innerText = t('appName');
    document.querySelector('h4').innerText = t('description');
    document.querySelector('#uri-label').innerText = t('uriLabel');
    document.querySelector('#plain-text-label').innerText = t('plainTextLabel');
    document.querySelector('#upload-file-label').innerText = t('uploadFileLabel');
    document.querySelector('#channel-label').innerText = t('channelLabel');
    document.querySelector('#epg-label').innerText = t('epgLabel');
    document.querySelector('#proxy-label').innerText = t('proxyLabel');
    document.querySelectorAll('.confirm').forEach(
        i => i.value = t('confirm')
    );
    document.querySelectorAll('.add').forEach(
        i => i.value = t('add')
    );

    const source = document.querySelector('#source');

    const uploadFile = document.querySelector('#upload-file');

    uploadFile.onchange = function (e) {
        handleFiles(e.target.files)
    }

    const handleFiles = async function (files) {
        for (let i = 0; i < files.length; i++) {
            await read(files[i]);
        }
    }

    const read = async (file) => {
        const reader = new FileReader();
        reader.onload = async (e) => {
            if (await save('/api/import-text', e.target.result)) {
                showMessage('已上传', 3000);
            }
        };
        reader.readAsText(file);
    }

    ['#uri', '#plain-text', '#channel', '#epg', '#proxy'].forEach(e => {
        const ele = document.querySelector(e);
        ele.addEventListener('focus', () => {
            ele.scrollIntoView({
                behavior: 'smooth',
                block: 'start'
            });
        });
    })

    document.querySelector('#confirm-uri').onclick = async () => {
        let uri = document.querySelector('#uri').value.trim();
        if (!uri) {
            alert('无效的地址' + uri);
            return;
        }
        if (!uri.startsWith('http')) {
            uri = 'http://' + uri;
        }
        if (!isValidUrl(uri)) {
            alert('无效的地址' + uri);
            return;
        }
        document.querySelector('#uri').value = uri;

        const uuid = uuidV4();
        if (!await save('/api/import-uri', JSON.stringify({id: uuid, uri: uri}))) {
            return;
        }
        showMessage('已确认', 3000);

        const row = createRow(uri, 'source-grey', t('remove'), 'remove');
        buttonOf(row).dataset.sourceId = uuid;
        const firstChild = source.firstChild;
        if (firstChild) {
            source.insertBefore(row, firstChild);
        } else {
            source.appendChild(row);
        }
        handleRemove();
    }

    document.querySelector('#confirm-plain-text').onclick = async () => {
        const content = document.querySelector('#plain-text').value.trim();
        if (content.length === 0) {
            alert('内容为空');
            return;
        }
        if (await save('/api/import-text', content)) {
            showMessage('已确认', 3000);
        }
    }

    document.querySelector('#confirm-channel').onclick = async () => {
        const channel = document.querySelector('#channel').value.trim();
        if (channel.length === 0) {
            alert('内容为空');
            return;
        }
        if (await save('/api/default-channel', JSON.stringify({channel: channel}))) {
            showMessage('已确认', 3000);
        }
    }

    document.querySelector('#confirm-epg').onclick = async () => {
        const epg = document.querySelector('#epg').value.trim();
        if (await save('/api/epg', JSON.stringify({epg: epg}))) {
            showMessage('已确认', 3000);
        }
    }

    document.querySelector('#confirm-proxy').onclick = async () => {
        let proxy = document.querySelector('#proxy').value.trim();
        if (proxy && (!proxy.startsWith('http') && !proxy.startsWith('socks'))) {
            proxy = 'http://' + proxy;
        }
        if (proxy && !isValidUrl(proxy)) {
            alert('无效的地址' + proxy);
            return;
        }
        document.querySelector('#proxy').value = proxy;
        if (await save('/api/proxy', JSON.stringify({proxy: proxy}))) {
            showMessage('已确认', 3000);
        }
    }

    const handleRemove = () => {
        const removes = document.querySelectorAll('.remove');
        [...removes].forEach(remove => {
            remove.value = t('remove');
            remove.onclick = async () => {
                const sourceId = (remove.dataset.sourceId || '').trim();
                if (await save('/api/remove-source', JSON.stringify({sourceId: sourceId}))) {
                    if (remove.parentElement) {
                        remove.parentElement.remove();
                    }
                }
            }
        })
    }

    const handleAdd = () => {
        const addList = document.querySelectorAll('.new-source');
        [...addList].forEach(add => {
            add.value = t('add');
            add.onclick = async () => {
                const uri = (add.dataset.uri || '').trim();
                const uuid = uuidV4();
                if (!await save('/api/import-uri', JSON.stringify({id: uuid, uri: uri}))) {
                    return;
                }
                const row = createRow(uri, 'source-grey', t('remove'), 'remove');
                buttonOf(row).dataset.sourceId = uuid;
                if (add.parentElement && add.parentElement.parentElement) {
                    add.parentElement.parentElement.insertBefore(row, add.parentElement);
                    add.parentElement.remove();
                }
                handleRemove();
                document.querySelector('#uri').value = uri;
            }
        })
    }

    const uuidV4 = () => {
        return ([1e7] + '-' + 1e3 + '-' + 4e3 + '-' + 8e3 + '-' + 1e11).replace(/[018]/g, c =>
            (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16)
        );
    }

    const isValidUrl = (url) => {
        try {
            new URL(url);
            return true;
        } catch (e) {
            return false;
        }
    }

    (async () => {
        if (!TOKEN) {
            showMessage('缺少访问令牌，请重新扫描电视上的二维码', 8000);
            return;
        }
        try {
            const response = await request('/api/settings');
            if (!response.ok) {
                throw new Error('settings');
            }
            const json = await response.json();
            document.querySelector('#channel').value = json.channelDefault;
            document.querySelector('#uri').value = json.channelUri;
            document.querySelector('#plain-text').value = json.channelText;
            document.querySelector('#epg').value = json.epg;
            document.querySelector('#proxy').value = json.proxy;

            (json.history || []).forEach(v => {
                const row = createRow(v.uri, 'source-grey', t('remove'), 'remove');
                buttonOf(row).dataset.sourceId = v.id;
                source.appendChild(row);
            })

            handleRemove()

            const sources = await request('/api/sources');
            let sourcesList = [];
            try {
                const parsed = await sources.json();
                if (Array.isArray(parsed)) {
                    sourcesList = parsed.map(v => v.uri).filter(v => typeof v === 'string');
                }
            } catch (e) {
                sourcesList = [];
            }

            const histories = (json.history || []).map(v => v.uri)

            const sourcesNew = document.querySelector('#sources-new');
            sourcesList.forEach(v => {
                if (histories.includes(v)) {
                    return
                }
                const row = createRow(v, 'source-green', t('add'), 'add new-source');
                buttonOf(row).dataset.uri = v;
                sourcesNew.appendChild(row);
            })

            handleAdd()
        } catch (e) {
            reportError(e);
        }
    })()

</script>
</html>
