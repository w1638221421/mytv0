name: dra-droidspaces
# 目标：给 DRA-AL00 / DURA64 / MT6739 / Linux 4.4.95 编一颗「Droidspaces 能跑」的内核
# 基础：沿用上一版 dra-kernel-v2 的成熟做法（用设备 /proc/config.gz 当基线、剔除源码里不存在的
#       imgsensor/LCM、CMA_DEBUG 处理、sched const 修补），在其上补 Droidspaces 官方 non-GKI 全量清单
#       + 官方两个补丁，并把 ANDROID_PARANOID_NETWORK 关掉（否则容器里没网）。
on:
  push:
    branches: [dra-droidspaces]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: deps
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev python2.7 libpython2.7-stdlib git patch
          sudo ln -sf /usr/bin/python2.7 /usr/bin/python
          python -V

      - name: toolchain
        run: |
          git clone --depth=1 https://github.com/KudProject/aarch64-linux-android-4.9 "${GITHUB_WORKSPACE}/gcc49"
          "${GITHUB_WORKSPACE}/gcc49/bin/aarch64-linux-android-gcc" --version | head -1

      - name: source + base config（原厂 /proc/config.gz）
        run: |
          set -e
          git clone --depth=1 -b og https://github.com/paperluigis/android-huawei-dura-kernel kernel
          head -5 kernel/Makefile
          cp stock.config kernel/stock.config
          mkdir -p kernel/out
          cp stock.config kernel/out/.config
          echo "base symbols: $(grep -c '^CONFIG_\|^# CONFIG_' kernel/out/.config)"

      - name: configure（Droidspaces non-GKI 全量清单）
        run: |
          set -e
          cd kernel
          export ARCH=arm64
          export CROSS_COMPILE="$GITHUB_WORKSPACE/gcc49/bin/aarch64-linux-android-"

          scripts/config --file out/.config \
            --enable SYSCTL --enable SYSVIPC --enable POSIX_MQUEUE \
            --enable NAMESPACES --enable UTS_NS --enable IPC_NS --enable PID_NS --enable NET_NS --enable USER_NS \
            --enable SECCOMP --enable SECCOMP_FILTER \
            --enable CGROUPS --enable CGROUP_DEVICE --enable CGROUP_SCHED --enable FAIR_GROUP_SCHED \
            --enable CGROUP_FREEZER --enable CGROUP_CPUACCT --enable CGROUP_NET_PRIO --enable CGROUP_PIDS \
            --enable MEMCG --enable MEMCG_SWAP --enable CFS_BANDWIDTH \
            --enable DEVTMPFS --disable DEVTMPFS_MOUNT --enable OVERLAY_FS \
            --enable TMPFS_POSIX_ACL --enable TMPFS_XATTR \
            --enable FW_LOADER --enable FW_LOADER_USER_HELPER --enable FW_LOADER_COMPRESS \
            --enable BLK_DEV_LOOP --enable EXT4_FS --enable FUSE_FS --enable TUN --enable BINFMT_MISC \
            --enable VETH --enable BRIDGE --enable BRIDGE_NETFILTER --enable MACVLAN \
            --enable NETFILTER --enable NETFILTER_ADVANCED --enable NF_CONNTRACK --enable NF_TABLES \
            --enable IP_NF_IPTABLES --enable IP_NF_FILTER --enable IP_NF_NAT \
            --enable IP_NF_TARGET_MASQUERADE --enable NETFILTER_XT_TARGET_MASQUERADE \
            --enable NETFILTER_XT_TARGET_TCPMSS --enable NETFILTER_XT_MATCH_ADDRTYPE \
            --enable NETFILTER_XT_MATCH_CONNTRACK --enable NF_NAT --enable NF_NAT_REDIRECT \
            --enable NF_CONNTRACK_NETLINK --enable NETFILTER_XTABLES --enable NETFILTER_XT_NAT \
            --enable NETFILTER_XT_TARGET_REDIRECT \
            --enable IP_ADVANCED_ROUTER --enable IP_MULTIPLE_TABLES \
            --enable IPV6_MULTIPLE_TABLES --enable IP6_NF_IPTABLES --enable IP6_NF_FILTER \
            --enable IP6_NF_MANGLE --enable IP6_NF_NAT --enable IP6_NF_TARGET_MASQUERADE \
            --enable IP_NF_TARGET_REJECT --enable IP6_NF_TARGET_REJECT \
            --enable NETFILTER_XT_TARGET_LOG \
            --enable NETFILTER_XT_MATCH_HASHLIMIT --enable NETFILTER_XT_MATCH_PKTTYPE \
            --enable IP_SET --enable IP_SET_HASH_IP --enable IP_SET_HASH_NET --enable NETFILTER_XT_SET \
            --enable NETFILTER_NETLINK_QUEUE --enable NETFILTER_NETLINK_LOG --enable NETFILTER_XT_TARGET_NFLOG \
            --disable NETFILTER_XT_MATCH_OWNER --enable NETFILTER_XT_MATCH_QTAGUID

          # ★ NETFILTER_XT_MATCH_QTAGUID 依赖 OWNER=n（原厂就是 owner 关、qtaguid 开）。
          #   打开 OWNER 会把 Android 的流量统计(qtaguid)挤掉，所以这里明确 owner=n、qtaguid=y。

          # ★ 关键：Android paranoid network 只放行 AID_INET 组的 socket，容器里的 root 不在组内 -> 容器无网
          scripts/config --file out/.config --disable ANDROID_PARANOID_NETWORK

          # 过滤本源码树不存在的 imgsensor / LCM（原厂配置点名了源码里没有的驱动）
          D=drivers/misc/mediatek/imgsensor/src/common/v1
          L=drivers/misc/mediatek/lcm
          S=$(grep -m1 '^CONFIG_CUSTOM_KERNEL_IMGSENSOR=' out/.config | cut -d'"' -f2)
          K=""
          for x in $S; do if [ -d "$D/$x" ]; then K="$K $x"; else echo "DROP sensor: $x"; fi; done
          scripts/config --file out/.config --set-str CUSTOM_KERNEL_IMGSENSOR "$(echo $K)"
          C=$(grep -m1 '^CONFIG_CUSTOM_KERNEL_LCM=' out/.config | cut -d'"' -f2)
          K2=""
          for x in $C; do if [ -d "$L/$x" ]; then K2="$K2 $x"; else echo "DROP lcm: $x"; fi; done
          scripts/config --file out/.config --set-str CUSTOM_KERNEL_LCM "$(echo $K2)"
          grep -E '^CONFIG_CUSTOM_KERNEL_(LCM|IMGSENSOR)=' out/.config
          echo "$K2" | grep -q truly_nt35521z_5p45_hd_video || { echo "FATAL: 本机面板驱动丢失"; exit 1; }

          # CMA_DEBUG 被 ZONE_MOVABLE_CMA select 强制打开，原厂是 n
          sed -i 's/^\([[:space:]]*\)select CMA_DEBUG$/\1# select CMA_DEBUG  # off to match stock/' mm/Kconfig
          scripts/config --file out/.config --disable CMA_DEBUG
          scripts/config --file out/.config --disable CMA_DEBUGFS

          make O=out ARCH=arm64 CROSS_COMPILE="$CROSS_COMPILE" olddefconfig
          scripts/config --file out/.config \
            --disable CMA_DEBUG --disable CMA_DEBUGFS \
            --enable NAMESPACES --enable PID_NS --enable IPC_NS --enable NET_NS --enable USER_NS \
            --enable SYSVIPC --enable POSIX_MQUEUE --enable CGROUP_DEVICE --enable MEMCG \
            --enable MEMCG_SWAP --enable CFS_BANDWIDTH --enable CGROUP_PIDS \
            --enable DEVTMPFS --enable TMPFS_POSIX_ACL --enable TMPFS_XATTR --enable FW_LOADER_COMPRESS \
            --enable VETH --enable NF_TABLES --enable NETFILTER_XT_MATCH_ADDRTYPE \
            --enable IP6_NF_NAT --enable IP6_NF_TARGET_MASQUERADE --enable MACVLAN \
            --disable ANDROID_PARANOID_NETWORK
          # 最后一次 olddefconfig 会复活 CMA_DEBUG，这里再用 sed 钉死，之后不再 olddefconfig
          make O=out ARCH=arm64 CROSS_COMPILE="$CROSS_COMPILE" olddefconfig
          sed -i 's/^CONFIG_CMA_DEBUG=y/# CONFIG_CMA_DEBUG is not set/' out/.config || true
          sed -i 's/^CONFIG_CMA_DEBUGFS=y/# CONFIG_CMA_DEBUGFS is not set/' out/.config || true

          echo "=== 与原厂配置的差异（应该只有我们主动改的） ==="
          python3 - <<'PY'
          def load(p):
              d={}
              for l in open(p,errors='ignore'):
                  l=l.strip()
                  if l.startswith('CONFIG_') and '=' in l:
                      k,v=l.split('=',1); d[k]=v
                  elif l.startswith('# CONFIG_') and l.endswith('is not set'):
                      d[l[2:].split(' is not')[0]]='n'
              return d
          s=load('stock.config'); n=load('out/.config')
          ch=[(k,s.get(k),n.get(k)) for k in sorted(set(s)|set(n)) if s.get(k)!=n.get(k)]
          print("changed symbols: %d" % len(ch))
          for k,a,b in ch: print("  %s: stock=%s new=%s" % (k,a,b))
          PY

      - name: source hotfixes + Droidspaces 官方补丁
        run: |
          set -e
          cd kernel
          # 1) SCHED_DEBUG=n 时 const_debug => const，MTK 调度代码要写它
          sed -i 's/const_debug unsigned int sysctl_sched_migration_cost/unsigned int sysctl_sched_migration_cost/g' kernel/sched/fair.c
          sed -i 's/extern const_debug unsigned int sysctl_sched_migration_cost/extern unsigned int sysctl_sched_migration_cost/g' kernel/sched/sched.h
          sed -i 's/^\([[:space:]]*\)sysctl_sched_migration_cost = /\1*(unsigned int *)\&sysctl_sched_migration_cost = /' drivers/misc/mediatek/sched/sched_ctl.c
          # 2) 老代码 + 新 GCC
          sed -i 's/-Wdeclaration-after-statement/-Wno-declaration-after-statement/g' Makefile
          grep -q 'Wno-error=return-type' Makefile || sed -i 's/^KBUILD_CFLAGS :=/KBUILD_CFLAGS := -Wno-error=return-type -Wno-error=incompatible-pointer-types /' Makefile
          # 3) dtc yylloc 在 -fcommon 下重复定义
          for f in scripts/dtc/dtc-lexer.l scripts/dtc/dtc-lexer.lex.c scripts/dtc/dtc-parser.y scripts/dtc/dtc-parser.tab.c; do
            [ -f "$f" ] && sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' "$f" || true
          done

          # 4) Droidspaces 官方 non-GKI 补丁 01：xt_qtaguid（不打它，跑容器后内核空指针 -> 手机重启）
          python3 - <<'PY'
          p='net/netfilter/xt_qtaguid.c'
          s=open(p).read()
          o1="\tstruct rtnl_link_stats64 dev_stats, *stats;\n"
          n1="\tstruct rtnl_link_stats64 *stats;\n"
          o2=("\tif (iface_entry->active) {\n"
              "\t\tstats = dev_get_stats(iface_entry->net_dev,\n"
              "\t\t\t\t      &dev_stats);\n"
              "\t} else {\n"
              "\t\tstats = &no_dev_stats;\n"
              "\t}\n")
          n2="\tstats = &no_dev_stats;\n"
          assert o1 in s and o2 in s, 'xt_qtaguid 上下文不匹配'
          open(p,'w').write(s.replace(o1,n1).replace(o2,n2))
          print('[+] patch 01 ok')
          PY

          # 5) 官方补丁 02：cgroup file prefix（官方版面向 4.5+ 的 kernel/cgroup/cgroup.c，
          #    本机 4.4 在 kernel/cgroup.c，按同样的语义落地）
          python3 - <<'PY'
          p='kernel/cgroup.c'
          s=open(p).read()
          anchor=("\t\tspin_lock_irq(&cgroup_file_kn_lock);\n"
                  "\t\tcfile->kn = kn;\n"
                  "\t\tspin_unlock_irq(&cgroup_file_kn_lock);\n"
                  "\t}\n"
                  "\n"
                  "\treturn 0;\n"
                  "}\n")
          inject=("\t\tspin_lock_irq(&cgroup_file_kn_lock);\n"
                  "\t\tcfile->kn = kn;\n"
                  "\t\tspin_unlock_irq(&cgroup_file_kn_lock);\n"
                  "\t}\n"
                  "\n"
                  "\t/* Droidspaces/LXC: noprefix 挂载时同时暴露 \"ctrl.file\" 别名 */\n"
                  "\tif (cft->ss && (cgrp->root->flags & CGRP_ROOT_NOPREFIX) &&\n"
                  "\t    !(cft->flags & CFTYPE_NO_PREFIX)) {\n"
                  "\t\tchar alias[CGROUP_FILE_NAME_MAX];\n"
                  "\t\tsnprintf(alias, CGROUP_FILE_NAME_MAX, \"%s.%s\",\n"
                  "\t\t\t cgroup_on_dfl(cgrp) ? cft->ss->name : cft->ss->legacy_name,\n"
                  "\t\t\t cft->name);\n"
                  "\t\tkernfs_create_link(cgrp->kn, alias, kn);\n"
                  "\t}\n"
                  "\n"
                  "\treturn 0;\n"
                  "}\n")
          if s.count(anchor)==1:
              open(p,'w').write(s.replace(anchor,inject)); print('[+] patch 02 ok')
          else:
              print('[!] patch 02 anchor=%d，跳过（不阻塞）' % s.count(anchor))
          PY

      - name: 断言（Droidspaces must have）
        run: |
          set -e
          cd kernel
          MUST="NAMESPACES PID_NS UTS_NS IPC_NS NET_NS USER_NS SYSVIPC POSIX_MQUEUE SECCOMP SECCOMP_FILTER \
                CGROUPS CGROUP_DEVICE CGROUP_SCHED CGROUP_FREEZER CGROUP_CPUACCT CGROUP_PIDS \
                MEMCG CFS_BANDWIDTH DEVTMPFS OVERLAY_FS TMPFS_POSIX_ACL TMPFS_XATTR \
                VETH BRIDGE NF_CONNTRACK IP_NF_IPTABLES IP_NF_FILTER NF_NAT \
                IP_NF_TARGET_MASQUERADE NETFILTER_XT_MATCH_ADDRTYPE"
          BAD=""
          for s in $MUST; do grep -q "^CONFIG_$s=y" out/.config || BAD="$BAD $s"; done
          echo "=== 关键项 ==="
          for s in $MUST ANDROID_PARANOID_NETWORK FW_LOADER FW_LOADER_COMPRESS CGROUP_NET_PRIO MEMCG_SWAP NF_TABLES CMA_DEBUG; do
            printf '%-36s %s\n' "$s" "$(grep -E "^CONFIG_$s=|^# CONFIG_$s is not set" out/.config | head -1)"
          done
          [ -z "$BAD" ] || { echo "FATAL missing:$BAD"; exit 1; }
          grep -q '^CONFIG_ANDROID_PARANOID_NETWORK=y' out/.config && { echo "FATAL: paranoid network 没关"; exit 1; }
          grep -q '^CONFIG_CMA_DEBUG=y' out/.config && { echo "FATAL: CMA_DEBUG 复活"; exit 1; }
          grep -q '^CONFIG_NETFILTER_XT_MATCH_QTAGUID=y' out/.config || { echo "FATAL: qtaguid 被 OWNER 挤掉了"; exit 1; }
          grep -q 'Droidspaces/LXC' kernel/cgroup.c || echo "(warn) cgroup 补丁未打"
          grep -q 'stats = &no_dev_stats;' net/netfilter/xt_qtaguid.c
          echo "[+] all good"

      - name: build
        run: |
          set -e
          cd kernel
          export ARCH=arm64
          export CROSS_COMPILE="$GITHUB_WORKSPACE/gcc49/bin/aarch64-linux-android-"
          export HOSTCFLAGS="-fcommon"
          make O=out ARCH=arm64 CROSS_COMPILE="$CROSS_COMPILE" HOSTCFLAGS="-fcommon" -j"$(nproc)" Image
          make O=out ARCH=arm64 CROSS_COMPILE="$CROSS_COMPILE" HOSTCFLAGS="-fcommon" -j"$(nproc)" Image.gz
          ls -l out/arch/arm64/boot/Image out/arch/arm64/boot/Image.gz

      - name: package
        run: |
          set -e
          mkdir -p artifact
          cp kernel/out/arch/arm64/boot/Image artifact/Image
          cp kernel/out/arch/arm64/boot/Image.gz artifact/Image.gz
          cp kernel/out/.config artifact/config.txt
          cp kernel/stock.config artifact/stock.config
          { echo "device: DRA-AL00 / DURA64 / MT6739 / 4.4.95"; echo "commit: $(git -C kernel rev-parse HEAD)"; echo "time: $(date -u +%FT%TZ)"; } > artifact/build-info.txt
          (cd artifact && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: dra-droidspaces-image
          path: artifact/
