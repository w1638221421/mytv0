name: src dump
on:
  push:
    branches: [srcdump]
  workflow_dispatch:
jobs:
  dump:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: get source
        run: |
          mkdir -p src
          URL="https://download-c1.huawei.com/download/downloadCenter?downloadId=5E5F1FF8BAE2D3B6C865452D95215F2F&version=E3B4C5DDCF2BB14EF20527C810B6E308&siteCode=worldwide"
          wget -q --tries=3 --timeout=600 -U "Mozilla/5.0" -O /tmp/dura.gz "$URL"
          ls -l /tmp/dura.gz
          tar -xzf /tmp/dura.gz -C src --wildcards 'Code_Opensource/kernel-4.4/kernel/printk/*' 'Code_Opensource/kernel-4.4/init/*' 'Code_Opensource/kernel-4.4/kernel/sysctl.c' || true
      - name: grep disable_uart
        run: |
          K=src/Code_Opensource/kernel-4.4
          echo "===== files containing disable_uart ====="
          grep -rln "disable_uart" $K 2>/dev/null || echo none
          echo "===== grep -n ====="
          grep -rn "disable_uart" $K 2>/dev/null | head -60 || true
      - name: dump printk dir
        run: |
          K=src/Code_Opensource/kernel-4.4
          ls -l $K/kernel/printk/ || true
          for f in $K/kernel/printk/*.c $K/kernel/printk/*.h; do
            [ -f "$f" ] || continue
            echo "########## $f ##########"
            wc -l "$f"
            if echo "$f" | grep -qi "mtk_printk\|printf"; then sed -n '1,400p' "$f"; fi
          done