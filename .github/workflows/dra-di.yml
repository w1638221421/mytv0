name: src dump
on:
  push:
    branches: [srcdump]
  workflow_dispatch:
jobs:
  dump:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: get source
        run: |
          mkdir -p src
          URL="https://download-c1.huawei.com/download/downloadCenter?downloadId=5E5F1FF8BAE2D3B6C865452D95215F2F&version=E3B4C5DDCF2BB14EF20527C810B6E308&siteCode=worldwide"
          wget -q --tries=3 --timeout=600 -U "Mozilla/5.0" -O /tmp/dura.gz "$URL"
          tar -xzf /tmp/dura.gz -C src --wildcards 'Code_Opensource/kernel-4.4/kernel/printk/*' 'Code_Opensource/kernel-4.4/init/main.c' || true
      - name: dump key sections
        run: |
          K=src/Code_Opensource/kernel-4.4
          P=$K/kernel/printk/printk.c
          echo "===== 60..120 ====="; sed -n '60,120p' $P
          echo "===== 1300..1330 ====="; sed -n '1300,1330p' $P
          echo "===== 1740..1775 ====="; sed -n '1740,1775p' $P
          echo "===== 2100..2135 ====="; sed -n '2100,2135p' $P
          echo "===== grep mt_need_uart_console ====="; grep -rn "mt_need_uart_console" $K 2>/dev/null | head -20
          echo "===== grep console_setup/__setup ====="; grep -n "__setup\|early_param" $P | head -30
          echo "===== init/main.c: kernel_init ====="; grep -n "run_init_process\|kernel_init\|ramdisk_execute_command" $K/init/main.c | head -40