name: phase7-disasm
on:
  push:
    branches: [ds-kernel-v2]
  workflow_dispatch:

jobs:
  disasm:
    name: disasm
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: binutils for aarch64
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends binutils-aarch64-linux-gnu
          aarch64-linux-gnu-objdump --version | head -1

      - name: decode slices from slices.txt
        run: |
          set -e
          python3 - <<'PY'
          import base64, os
          os.makedirs('/tmp/sl', exist_ok=True)
          meta = []
          for line in open('slices.txt', encoding='utf-8'):
              name, va, n, b64 = line.rstrip('\n').split('\t')
              data = base64.b64decode(b64)
              path = '/tmp/sl/%s.bin' % name
              open(path, 'wb').write(data)
              meta.append((name, va, len(data)))
              print('%-45s va=%s bytes=%d' % (name, va, len(data)))
          open('/tmp/sl/meta.txt', 'w').write('\n'.join('%s\t%s' % (n, v) for n, v, _ in meta) + '\n')
          PY

      - name: disassemble
        run: |
          set -e
          mkdir -p artifacts
          while IFS=$'\t' read -r name va; do
            echo "=============== $name (va 0x$va) ===============" | tee -a artifacts/disasm.txt
            aarch64-linux-gnu-objdump -D -b binary -m aarch64 \
              --adjust-vma=0x$va /tmp/sl/$name.bin >> artifacts/disasm.txt
          done < /tmp/sl/meta.txt
          echo "--- summary of first 24 instructions per symbol ---" > artifacts/disasm-head.txt
          awk '/^===============/{p=1;c=0} p&&c<26{print;c++}' artifacts/disasm.txt >> artifacts/disasm-head.txt
          cat artifacts/disasm.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase7-disasm
          path: artifacts/*
          if-no-files-found: warn
