name: phase2-case5
on:
  push:
    branches: [ds-kernel-v2]
  workflow_dispatch:

jobs:
  resolve:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends gcc make bison flex bc
      - name: clone
        run: git clone --depth=1 -b og https://github.com/paperluigis/android-huawei-dura-kernel kernel
      - name: cases
        run: |
          set -e
          mkdir -p artifacts
          cd kernel
          export ARCH=arm64
          run_case() {
            local CASE="$1"; shift
            cp ../configs/stock.config .config
            while [ $# -gt 0 ]; do
              local k="$1"; local v="$2"; shift 2
              if [ "$v" = "y" ]; then scripts/config --file .config --enable "$k";
              elif [ "$v" = "n" ]; then scripts/config --file .config --disable "$k"; fi
            done
            make ARCH=arm64 olddefconfig > "../artifacts/$CASE.log" 2>&1 || { echo "FATAL $CASE"; tail -20 "../artifacts/$CASE.log"; exit 1; }
            cp .config "../artifacts/$CASE.config"
            echo "case $CASE done"
          }
          # CASE-5: IPC_NS via POSIX_MQUEUE (SYSVIPC stays n) -- ABI-safe route test
          run_case CASE-5 NAMESPACES y UTS_NS y PID_NS y IPC_NS y POSIX_MQUEUE y SYSVIPC n NET_NS n USER_NS n
          # CASE-6: recommended full container config (SYSVIPC=n), verify all namespaces on, NET_NS/USER_NS off
          run_case CASE-6 NAMESPACES y UTS_NS y PID_NS y IPC_NS y POSIX_MQUEUE y SYSVIPC n NET_NS n USER_NS n SECCOMP y SECCOMP_FILTER y CGROUPS y CGROUP_FREEZER y DEVTMPFS y TMPFS_POSIX_ACL y TMPFS_XATTR y OVERLAY_FS y
      - name: summarize
        run: |
          cd kernel
          python3 - <<'PY'
          import re
          SYMS=["SYSVIPC","SYSVIPC_SYSCTL","NAMESPACES","UTS_NS","IPC_NS","PID_NS","NET_NS","USER_NS",
                "POSIX_MQUEUE","SECCOMP","SECCOMP_FILTER","CGROUPS","CGROUP_FREEZER","DEVTMPFS",
                "TMPFS_POSIX_ACL","TMPFS_XATTR","OVERLAY_FS","CGROUP_DEVICE","CGROUP_PIDS"]
          def load(p):
              d={}
              for ln in open(p,encoding='utf-8',errors='replace'):
                  ln=ln.strip()
                  m=re.match(r'^(CONFIG_[A-Z0-9_]+)=(.*)$',ln)
                  if m: d[m.group(1)]=m.group(2); continue
                  m=re.match(r'^# (CONFIG_[A-Z0-9_]+) is not set$',ln)
                  if m: d[m.group(1)]='n'
              return d
          for c in ["CASE-5","CASE-6"]:
              d=load("../artifacts/%s.config"%c)
              print("== "+c)
              for s in SYMS:
                  print("  %-22s %s" % (s, d.get("CONFIG_"+s)))
          # diff CASE-6 vs stock
          stock=load("../configs/stock.config")
          d6=load("../artifacts/CASE-6.config")
          ch=[(k,stock.get(k),d6.get(k)) for k in sorted(set(stock)|set(d6)) if stock.get(k)!=d6.get(k)]
          open("../artifacts/diff-CASE6-vs-stock.txt","w").write("changed: %d\n"%len(ch)+"\n".join("  %s: %s -> %s"%(k,a,b) for k,a,b in ch))
          print("== CASE-6 changed vs stock: %d"%len(ch))
          for k,a,b in ch: print("  %s: %s -> %s"%(k,a,b))
          PY
          ls -l ../artifacts/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase2-case5
          path: artifacts/*
          if-no-files-found: warn
