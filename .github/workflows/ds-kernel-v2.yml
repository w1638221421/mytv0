name: ds-kernel-v2

on:
  push:
    branches: [ds-kernel-v2]
  workflow_dispatch:

jobs:
  target:
    name: target
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: deps
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev python2.7 libpython2.7-stdlib git patch
          sudo ln -sf /usr/bin/python2.7 /usr/bin/python
          python -V

      - name: toolchain
        run: |
          git clone --depth=1 -b lineage-16.0 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-gnu-6.3.1 "${GITHUB_WORKSPACE}/gcc631"
          "${GITHUB_WORKSPACE}/gcc631/bin/aarch64-linux-gnu-gcc" --version | head -1

      - name: source and base config
        run: |
          set -e
          git clone --depth=1 https://github.com/mahdi-salimi05/kernel_huawei_dura repo
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL)\s*=' repo/kernel-4.4/Makefile
          cd repo/kernel-4.4
          cp "$GITHUB_WORKSPACE/configs/stock.config" .config
          echo "base symbols: $(grep -c '^CONFIG_\|^# CONFIG_' .config)"

      - name: configure
        run: |
          set -e
          cd repo/kernel-4.4
          export ARCH=arm64
          export CROSS_COMPILE="$GITHUB_WORKSPACE/gcc631/bin/aarch64-linux-gnu-"

          D=drivers/misc/mediatek/imgsensor/src/common/v1
          L=drivers/misc/mediatek/lcm
          S=$(grep -m1 '^CONFIG_CUSTOM_KERNEL_IMGSENSOR=' .config | cut -d'"' -f2)
          K=""; for x in $S; do [ -d "$D/$x" ] && K="$K $x" || echo "DROP sensor: $x"; done
          scripts/config --file .config --set-str CUSTOM_KERNEL_IMGSENSOR "$(echo $K)"
          C=$(grep -m1 '^CONFIG_CUSTOM_KERNEL_LCM=' .config | cut -d'"' -f2)
          K2=""; for x in $C; do [ -d "$L/$x" ] && K2="$K2 $x" || echo "DROP lcm: $x"; done
          scripts/config --file .config --set-str CUSTOM_KERNEL_LCM "$(echo $K2)"

          sed -i 's/^\([[:space:]]*\)select CMA_DEBUG$/\1# select CMA_DEBUG  # off to match stock/' mm/Kconfig
          scripts/config --file .config --disable CMA_DEBUG --disable CMA_DEBUGFS

          scripts/config --file .config \
            --enable SYSVIPC --enable SYSVIPC_SYSCTL \
            --enable NAMESPACES --enable UTS_NS --enable IPC_NS --enable PID_NS \
            --disable NET_NS --disable USER_NS

          make ARCH=arm64 CROSS_COMPILE="$CROSS_COMPILE" olddefconfig
          scripts/config --file .config --disable CMA_DEBUG --disable CMA_DEBUGFS
          make ARCH=arm64 CROSS_COMPILE="$CROSS_COMPILE" olddefconfig
          sed -i 's/^CONFIG_CMA_DEBUG=y/# CONFIG_CMA_DEBUG is not set/' .config || true
          sed -i 's/^CONFIG_CMA_DEBUGFS=y/# CONFIG_CMA_DEBUGFS is not set/' .config || true

          echo "=== namespace options ==="
          grep -E '^CONFIG_(NAMESPACES|UTS_NS|PID_NS|IPC_NS|SYSVIPC|SYSVIPC_SYSCTL|NET_NS|USER_NS|MODVERSIONS)=' .config || true
          echo "=== paranoid network (must stay y) ==="
          grep -E '^CONFIG_ANDROID_PARANOID_NETWORK=' .config || true

      - name: layout-preserving patch
        run: |
          set -e
          cd repo/kernel-4.4
          python3 "$GITHUB_WORKSPACE/tools/move_sysvipc.py" include/linux/sched.h
          python3 "$GITHUB_WORKSPACE/tools/add_offsets.py" arch/arm64/kernel/asm-offsets.c

      - name: source hotfixes
        run: |
          set -e
          cd repo/kernel-4.4
          sed -i 's/const_debug unsigned int sysctl_sched_migration_cost/unsigned int sysctl_sched_migration_cost/g' kernel/sched/fair.c
          sed -i 's/extern const_debug unsigned int sysctl_sched_migration_cost/extern unsigned int sysctl_sched_migration_cost/g' kernel/sched/sched.h
          sed -i 's/^\([[:space:]]*\)sysctl_sched_migration_cost = /\1*(unsigned int *)\&sysctl_sched_migration_cost = /' drivers/misc/mediatek/sched/sched_ctl.c
          sed -i 's/-Wdeclaration-after-statement/-Wno-declaration-after-statement/g' Makefile
          grep -q 'Wno-error=return-type' Makefile || sed -i 's/^KBUILD_CFLAGS :=/KBUILD_CFLAGS := -Wno-error=return-type -Wno-error=incompatible-pointer-types /' Makefile
          for f in scripts/dtc/dtc-lexer.l scripts/dtc/dtc-lexer.lex.c scripts/dtc/dtc-parser.y scripts/dtc/dtc-parser.tab.c; do
            [ -f "$f" ] && sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' "$f" || true
          done

      - name: fix vendor include paths
        run: |
          set -e
          cd repo/kernel-4.4
          python3 "$GITHUB_WORKSPACE/tools/fix_source_includes.py" .
          python3 "$GITHUB_WORKSPACE/tools/fix_sensor_lists.py" .

      - name: build
        run: |
          set -e
          cd repo/kernel-4.4
          export ARCH=arm64
          export CROSS_COMPILE="$GITHUB_WORKSPACE/gcc631/bin/aarch64-linux-gnu-"
          if ! make ARCH=arm64 CROSS_COMPILE="$CROSS_COMPILE" HOSTCFLAGS="-fcommon" -j"$(nproc)" Image.gz > build.log 2>&1; then
            echo "=== ERROR LINES ==="
            grep -nE "error:|fatal error|No rule to make|undefined reference|multiple definition|Error [0-9]" build.log | head -40
            echo "=== TAIL ==="
            tail -30 build.log
            exit 1
          fi
          ls -l arch/arm64/boot/Image.gz

      - name: package
        run: |
          set -e
          cd repo/kernel-4.4
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp arch/arm64/boot/Image.gz "$GITHUB_WORKSPACE/artifacts/Image.gz.target"
          cp Module.symvers "$GITHUB_WORKSPACE/artifacts/Module.symvers.target"
          cp .config "$GITHUB_WORKSPACE/artifacts/config.target"
          cp include/generated/asm-offsets.h "$GITHUB_WORKSPACE/artifacts/asm-offsets.target.h" 2>/dev/null || true
          cp include/config/kernel.release "$GITHUB_WORKSPACE/artifacts/kernel.release.target"
          grep -E '^#define DS_' include/generated/asm-offsets.h > "$GITHUB_WORKSPACE/artifacts/offsets.target.txt" 2>/dev/null || true
          python3 "$GITHUB_WORKSPACE/tools/check_crcs.py" Module.symvers "$GITHUB_WORKSPACE/configs/stock-modcrcs.txt" > "$GITHUB_WORKSPACE/artifacts/crc-gate.target.txt" 2>&1 || true
          echo "=== CRC gate ==="
          cat "$GITHUB_WORKSPACE/artifacts/crc-gate.target.txt"
          echo "=== release ==="
          cat "$GITHUB_WORKSPACE/artifacts/kernel.release.target"
          ls -l "$GITHUB_WORKSPACE/artifacts/"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ds-target
          path: artifacts/*
          if-no-files-found: warn
