name: phase4-sigrec2
on:
  push:
    branches: [ds-kernel-v2]
  workflow_dispatch:

jobs:
  sigrec:
    name: sigrec
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: deps
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends bc bison flex libssl-dev python2.7 libpython2.7-stdlib git patch
          sudo ln -sf /usr/bin/python2.7 /usr/bin/python

      - name: toolchain
        run: |
          git clone --depth=1 https://github.com/KudProject/aarch64-linux-android-4.9 "${GITHUB_WORKSPACE}/gcc49"

      - name: clone + prepare
        run: |
          set -e
          git clone --depth=1 -b og https://github.com/paperluigis/android-huawei-dura-kernel kernel
          cd kernel
          export ARCH=arm64
          export CROSS_COMPILE="$GITHUB_WORKSPACE/gcc49/bin/aarch64-linux-android-"
          echo "+" > .scmversion
          cp "$GITHUB_WORKSPACE/configs/stock.config" .config
          D=drivers/misc/mediatek/imgsensor/src/common/v1
          L=drivers/misc/mediatek/lcm
          S=$(grep -m1 '^CONFIG_CUSTOM_KERNEL_IMGSENSOR=' .config | cut -d'"' -f2)
          K=""; for x in $S; do [ -d "$D/$x" ] && K="$K $x"; done
          scripts/config --file .config --set-str CUSTOM_KERNEL_IMGSENSOR "$(echo $K)"
          C=$(grep -m1 '^CONFIG_CUSTOM_KERNEL_LCM=' .config | cut -d'"' -f2)
          K2=""; for x in $C; do [ -d "$L/$x" ] && K2="$K2 $x"; done
          scripts/config --file .config --set-str CUSTOM_KERNEL_LCM "$(echo $K2)"
          sed -i 's/^\([[:space:]]*\)select CMA_DEBUG$/\1# select CMA_DEBUG  # off to match stock/' mm/Kconfig
          scripts/config --file .config --disable CMA_DEBUG --disable CMA_DEBUGFS
          make ARCH=arm64 olddefconfig
          scripts/config --file .config --disable CMA_DEBUG --disable CMA_DEBUGFS
          make ARCH=arm64 olddefconfig
          sed -i 's/^CONFIG_CMA_DEBUG=y/# CONFIG_CMA_DEBUG is not set/' .config || true
          sed -i 's/const_debug unsigned int sysctl_sched_migration_cost/unsigned int sysctl_sched_migration_cost/g' kernel/sched/fair.c
          sed -i 's/extern const_debug unsigned int sysctl_sched_migration_cost/extern unsigned int sysctl_sched_migration_cost/g' kernel/sched/sched.h
          make ARCH=arm64 CROSS_COMPILE="$CROSS_COMPILE" HOSTCFLAGS="-fcommon" -j"$(nproc)" prepare > prepare.log 2>&1 || { tail -30 prepare.log; exit 1; }
          ls -l include/generated/autoconf.h
          echo "prepare ok"

      - name: genksyms + reference object (capture exact cflags)
        run: |
          set -e
          cd kernel
          export ARCH=arm64
          export CROSS_COMPILE="$GITHUB_WORKSPACE/gcc49/bin/aarch64-linux-android-"
          make ARCH=arm64 CROSS_COMPILE="$CROSS_COMPILE" HOSTCFLAGS="-fcommon" -j"$(nproc)" scripts > scripts.log 2>&1 || { tail -30 scripts.log; exit 1; }
          ls -l scripts/genksyms/genksyms
          make ARCH=arm64 CROSS_COMPILE="$CROSS_COMPILE" HOSTCFLAGS="-fcommon" -j"$(nproc)" init/main.o > ref.log 2>&1 || { tail -40 ref.log; exit 1; }
          ls -la init/.main.o.cmd
          cp init/.main.o.cmd "$GITHUB_WORKSPACE/adapt.cmd"
          head -c 400 "$GITHUB_WORKSPACE/adapt.cmd"

      - name: probe pipeline (variants + genksyms -D token dump)
        run: |
          set -e
          cd kernel
          for mode in def_real decl_real def_dummy decl_dummy; do
            python3 "$GITHUB_WORKSPACE/tools/gen_probes.py" "$mode" "$GITHUB_WORKSPACE/cand.c" "$GITHUB_WORKSPACE/cand.map"
            python3 "$GITHUB_WORKSPACE/tools/run_candidates.py" "$GITHUB_WORKSPACE"
            cp "$GITHUB_WORKSPACE/allcrc.txt" "$GITHUB_WORKSPACE/allcrc-$mode.txt"
            echo "===== mode $mode ====="
            cat "$GITHUB_WORKSPACE/allcrc-$mode.txt"
          done

          # exact source text with parameter names, as the real vendor .c has it
          cat > "$GITHUB_WORKSPACE/cand.c" <<'EOF'
          #include <linux/kernel.h>
          #include <linux/module.h>
          #include <linux/cdev.h>
          int cdev_add(struct cdev *p, dev_t dev, unsigned count) { }
          EXPORT_SYMBOL(cdev_add);
          void cdev_del(struct cdev *p) { }
          EXPORT_SYMBOL(cdev_del);
          EOF
          cat > "$GITHUB_WORKSPACE/cand.map" <<'EOF'
          cdev_add	probe	1d092a8a	-	int | struct cdev * p | dev_t dev | unsigned count
          cdev_del	probe	020f71e8	-	void | struct cdev * p
          EOF
          python3 "$GITHUB_WORKSPACE/tools/run_candidates.py" "$GITHUB_WORKSPACE"
          cp "$GITHUB_WORKSPACE/allcrc.txt" "$GITHUB_WORKSPACE/allcrc-pnames.txt"
          echo "===== mode pnames ====="
          cat "$GITHUB_WORKSPACE/allcrc-pnames.txt"

      - name: HARNESS VALIDATION - run genksyms over the real fs/char_dev.c
        run: |
          set -e
          cd kernel
          # if the harness is faithful it must reproduce the CRCs the real build
          # produced for char_dev.c: cdev_init=ce233b16 cdev_add=1d092a8a
          #                            cdev_del=020f71e8 (and cdev_alloc)
          cp fs/char_dev.c "$GITHUB_WORKSPACE/cand.c"
          : > "$GITHUB_WORKSPACE/cand.map"
          python3 "$GITHUB_WORKSPACE/tools/run_candidates.py" "$GITHUB_WORKSPACE" || true
          cp "$GITHUB_WORKSPACE/allcrc.txt" "$GITHUB_WORKSPACE/allcrc-realchardev.txt" || true
          echo "===== real char_dev.c CRCs ====="
          grep -E 'cdev' "$GITHUB_WORKSPACE/allcrc-realchardev.txt" || true

      - name: dump genksyms token streams for the MTK baseline signatures
        run: |
          set -e
          cd kernel
          cat > "$GITHUB_WORKSPACE/cand.c" <<'EOF'
          #include <linux/kernel.h>
          #include <linux/module.h>
          #include <linux/sched.h>
          #include <linux/mmc/card.h>
          void connectivity_export_show_stack(struct task_struct *tsk, unsigned long *sp) { }
          EXPORT_SYMBOL(connectivity_export_show_stack);
          void connectivity_export_tracing_record_cmdline(struct task_struct *tsk) { }
          EXPORT_SYMBOL(connectivity_export_tracing_record_cmdline);
          int connectivity_export_mmc_io_rw_direct(struct mmc_card *card, int write, unsigned fn, unsigned addr, u8 in, u8 *out) { }
          EXPORT_SYMBOL(connectivity_export_mmc_io_rw_direct);
          EOF
          python3 "$GITHUB_WORKSPACE/tools/dump_defs.py" "$GITHUB_WORKSPACE" > "$GITHUB_WORKSPACE/defs.log" 2>&1 || true
          head -c 4000 "$GITHUB_WORKSPACE/defs.log"

      - name: recover signatures (batched genksyms CRC search)
        run: |
          set -e
          cd kernel
          python3 "$GITHUB_WORKSPACE/tools/gen_candidates.py" "$GITHUB_WORKSPACE/cand.c" "$GITHUB_WORKSPACE/cand.map"
          python3 "$GITHUB_WORKSPACE/tools/run_candidates.py" "$GITHUB_WORKSPACE"
          cp "$GITHUB_WORKSPACE/allcrc.txt" "$GITHUB_WORKSPACE/allcrc-search.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase4-sigrec2
          path: |
            cand.map
            sig-hits.txt
            adapt.cmd
            allcrc-*.txt
            defs.log
            defs-dump.txt
          if-no-files-found: warn
