name: dra-fbidx
# 打点构建：用真实 framebuffer 画 initcall 序号方块，用于定位内核死点
on:
  push:
    branches: [fbidx]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: deps
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev python2.7 libpython2.7-stdlib git wget
          sudo ln -sf /usr/bin/python2.7 /usr/bin/python || true
          sudo ln -sf /usr/bin/python2.7 /usr/bin/python2 || true
          python -V

      - name: toolchain
        run: |
          git clone --depth=1 https://github.com/KudProject/aarch64-linux-android-4.9 gcc49
          gcc49/bin/aarch64-linux-android-gcc --version | head -1

      - name: build
        run: bash ci/build_fbidx.sh

      - name: package
        run: |
          set -e
          ls -l out
          (cd out && sha256sum Image config.txt)
          mkdir -p artifact && cp out/* artifact/

      - uses: actions/upload-artifact@v4
        with:
          name: fbidx-image
          path: artifact/
