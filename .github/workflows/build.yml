name: build

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:

# 打 tag 时用 GITHUB_TOKEN 建 Release，需要 contents: write
permissions:
  contents: write

jobs:
  build:
    name: media3 ${{ matrix.media3 }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - media3: '1.8.0'
            kotlin: '2.0.0'
            compileSdk: 35
            minSdk: 21
          - media3: '1.11.1'
            kotlin: '2.2.10'
            compileSdk: 36
            minSdk: 23
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # 仓库默认是 1.8.0 兼容版；矩阵里直接改这四行切内核
      - name: 切换 Media3 内核
        run: |
          sed -i "s/^media3 = .*/media3 = \"${{ matrix.media3 }}\"/" gradle/libs.versions.toml
          sed -i "s/^kotlin-android = .*/kotlin-android = \"${{ matrix.kotlin }}\"/" gradle/libs.versions.toml
          sed -i "s/^    compileSdk = .*/    compileSdk = ${{ matrix.compileSdk }}/" app/build.gradle.kts
          sed -i "s/^        minSdk = .*/        minSdk = ${{ matrix.minSdk }}/" app/build.gradle.kts
          grep -E '^(media3|kotlin-android)' gradle/libs.versions.toml
          grep -E '^(    compileSdk|        minSdk)' app/build.gradle.kts

      - name: 单元测试
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: 构建 release
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: 对齐 + 签名
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          OUT="my-tv-0-release-media3-${{ matrix.media3 }}"
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::未配置 KEYSTORE_BASE64，输出未签名包"
            cp app/build/outputs/apk/release/app-release-unsigned.apk "${OUT}-unsigned.apk"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          BT="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)"
          "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --min-sdk-version ${{ matrix.minSdk }} \
            --ks release.jks --ks-pass "pass:$KS_PASS" --key-pass "pass:$KEY_PASS" \
            --ks-key-alias "$KEY_ALIAS" --out "${OUT}.apk" aligned.apk
          "$BT/apksigner" verify --print-certs "${OUT}.apk" | head -3
          rm -f release.jks aligned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk-media3-${{ matrix.media3 }}
          path: my-tv-0-release-media3-*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: attach to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: 创建 Release 并上传 apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" out/*.apk --generate-notes --title "${{ github.ref_name }}"
